<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>South Austin</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f7f2e8;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    img {
      display: block;
      width: min(520px, 82vw);
      height: auto;
    }
  </style>
</head>
<body>
  <img src="south-austin-logo.png" alt="South Austin" />
</body>
</html>
